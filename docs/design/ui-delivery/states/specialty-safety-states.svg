<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="t d"><title id="t">haoemr 核心专科安全状态母版</title><desc id="d">母婴、夫妇、儿童剂量、精神隐私、侧别部位牙位、中医证候与设备离线状态</desc><rect width="1440" height="960" fill="#F3F6F9"/><rect width="1440" height="64" fill="#102A43"/><text x="40" y="41" fill="#fff" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700">核心专科安全状态母版</text><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="104" fill="#607086" font-size="13">专科视觉不改变品牌主色；专业风险使用全院统一语义和本科对象标识。</text>
<g transform="translate(40 140)"><rect width="650" height="220" rx="10" fill="#fff" stroke="#E7A8A8"/><rect width="5" height="220" rx="3" fill="#C53030"/><text x="26" y="40" fill="#8E2626" font-size="16" font-weight="700">妇产/新生儿 · 母婴关系冲突</text><text x="26" y="76" fill="#31445C" font-size="13">新生儿手环 NB-02819 关联的母亲与当前产妇不一致</text><text x="26" y="108" fill="#607086" font-size="12">阻断喂养、给药、标本采集和出院；需护士长复核关系链</text><rect x="26" y="146" width="118" height="34" rx="6" fill="#C53030"/><text x="49" y="168" fill="#fff" font-size="12">启动双人复核</text><text x="168" y="168" fill="#607086" font-size="11">对象：M-21008 ↔ NB-02819</text></g>
<g transform="translate(750 140)"><rect width="650" height="220" rx="10" fill="#fff" stroke="#E9C977"/><rect width="5" height="220" rx="3" fill="#B7791F"/><text x="26" y="40" fill="#76500B" font-size="16" font-weight="700">生殖医学 · 夫妇关系待复核</text><text x="26" y="76" fill="#31445C" font-size="13">双方身份已核验，但知情同意版本与本周期不一致</text><text x="26" y="108" fill="#607086" font-size="12">冻融、移植等关键步骤进入前必须重新签署</text><rect x="26" y="146" width="110" height="34" rx="6" fill="#1769E0"/><text x="49" y="168" fill="#fff" font-size="12">打开关系链</text></g>
<g transform="translate(40 392)"><rect width="650" height="220" rx="10" fill="#fff" stroke="#E7A8A8"/><rect width="5" height="220" rx="3" fill="#C53030"/><text x="26" y="40" fill="#8E2626" font-size="16" font-weight="700">儿科/新生儿 · 剂量越界</text><text x="26" y="76" fill="#31445C" font-size="13">当前体重 3.2 kg，候选剂量超过本院上限 28%</text><text x="26" y="108" fill="#607086" font-size="12">体重来源：床旁秤 DEV-32 · 08:18；规则 PED-DOSE-044 v5</text><rect x="26" y="146" width="126" height="34" rx="6" fill="#C53030"/><text x="49" y="168" fill="#fff" font-size="12">重新计算并复核</text></g>
<g transform="translate(750 392)"><rect width="650" height="220" rx="10" fill="#fff" stroke="#CFBEF4"/><rect width="5" height="220" rx="3" fill="#6D45C2"/><text x="26" y="40" fill="#56359C" font-size="16" font-weight="700">精神科 · 特殊隐私与危机评估</text><text x="26" y="76" fill="#31445C" font-size="13">高风险字段只对授权治疗组展示，导出时默认去标识</text><text x="26" y="108" fill="#607086" font-size="12">自伤风险评估未完成，AI 仅可提醒，不得代替医师结论</text><rect x="26" y="146" width="122" height="34" rx="6" fill="#1769E0"/><text x="49" y="168" fill="#fff" font-size="12">进入危机评估</text></g>
<g transform="translate(40 644)"><rect width="650" height="250" rx="10" fill="#fff" stroke="#E7A8A8"/><rect width="5" height="250" rx="3" fill="#C53030"/><text x="26" y="40" fill="#8E2626" font-size="16" font-weight="700">眼/耳鼻喉/口腔/皮肤 · 侧别与部位冲突</text><text x="26" y="76" fill="#31445C" font-size="13">申请单：右眼；设备采集：左眼；当前编辑：右眼</text><text x="26" y="108" fill="#607086" font-size="12">阻断报告签发和手术排程，保留 DICOM/Study 来源</text><rect x="26" y="146" width="118" height="34" rx="6" fill="#C53030"/><text x="49" y="168" fill="#fff" font-size="12">核验侧别部位</text><text x="26" y="215" fill="#607086" font-size="11">牙科使用 FDI 牙位编码；皮肤使用体表区域+图像时间点</text></g>
<g transform="translate(750 644)"><rect width="650" height="250" rx="10" fill="#fff" stroke="#CBD4DD"/><rect width="5" height="250" rx="3" fill="#526275"/><text x="26" y="40" fill="#435164" font-size="16" font-weight="700">中医/专科设备 · 来源离线</text><text x="26" y="76" fill="#31445C" font-size="13">舌象设备离线，当前显示上次采集图像</text><text x="26" y="108" fill="#607086" font-size="12">图像时间：08:10；证候辨证仍需医师手工确认</text><rect x="26" y="146" width="116" height="34" rx="6" fill="#1769E0"/><text x="49" y="168" fill="#fff" font-size="12">重连采集设备</text><rect x="156" y="146" width="110" height="34" rx="6" fill="#fff" stroke="#DCE3EB"/><text x="179" y="168" fill="#31445C" font-size="12">继续手工输入</text><text x="26" y="215" fill="#607086" font-size="11">手工结果保留“设备缺失”来源标识和审计</text></g></g></svg>
