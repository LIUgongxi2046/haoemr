<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="t d"><title id="t">haoemr AI医助小南与 Agent 状态母版</title><desc id="d">无上下文、建议、来源、低置信、Tool 批准、超时、拒绝、回人工和完成状态</desc><rect width="1440" height="960" fill="#F3F6F9"/><rect width="1440" height="64" fill="#102A43"/><text x="40" y="41" fill="#fff" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700">AI医助小南与 Agent 状态母版</text><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="40" y="100" width="1360" height="72" rx="8" fill="#F5F0FF" stroke="#CFBEF4"/><text x="64" y="130" fill="#56359C" font-size="17" font-weight="700">AI 是有来源、可拒绝、可停用的协作者</text><text x="64" y="154" fill="#607086" font-size="12">Agent/Skill/模型版本与上下文范围始终可见；未批准 Tool 不执行业务副作用。</text>
<g transform="translate(40 204)"><rect width="420" height="270" rx="10" fill="#fff" stroke="#DCE3EB"/><text x="24" y="38" fill="#172235" font-size="16" font-weight="700">无临床上下文</text><text x="24" y="72" fill="#607086" font-size="12">当前不在具体患者或就诊页面</text><rect x="24" y="101" width="372" height="78" rx="7" fill="#F8FAFC" stroke="#DCE3EB"/><text x="42" y="130" fill="#31445C" font-size="13">可用：产品帮助、配置说明、通用搜索</text><text x="42" y="156" fill="#607086" font-size="12">停用：患者总结、诊疗建议、业务写入</text><rect x="24" y="207" width="126" height="34" rx="6" fill="#1769E0"/><text x="47" y="229" fill="#fff" font-size="12">搜索产品帮助</text></g>
<g transform="translate(510 204)"><rect width="420" height="270" rx="10" fill="#fff" stroke="#CFBEF4"/><rect width="5" height="270" rx="3" fill="#6D45C2"/><text x="24" y="38" fill="#56359C" font-size="16" font-weight="700">临床建议 · 待确认</text><text x="24" y="72" fill="#31445C" font-size="13">建议补充肾功能检查后再评估候选用药</text><text x="24" y="102" fill="#607086" font-size="12">来源：肌酐 2 条、用药 4 条、过敏 1 条</text><text x="24" y="132" fill="#607086" font-size="12">Agent：ClinicalCopilot v2.1 · Skill：RxReview v1.7</text><rect x="24" y="158" width="372" height="40" rx="6" fill="#FFF8E7" stroke="#E9C977"/><text x="42" y="183" fill="#76500B" font-size="12">不确定性：最近一次体重超过 72 小时</text><rect x="24" y="218" width="100" height="32" rx="6" fill="#6D45C2"/><text x="47" y="239" fill="#fff" font-size="12">审查建议</text><text x="151" y="239" fill="#115CBD" font-size="12">打开全部来源</text></g>
<g transform="translate(980 204)"><rect width="420" height="270" rx="10" fill="#fff" stroke="#E9C977"/><rect width="5" height="270" rx="3" fill="#B7791F"/><text x="24" y="38" fill="#76500B" font-size="16" font-weight="700">Tool 动作批准</text><text x="24" y="72" fill="#31445C" font-size="13">候选动作：创建 2 项检验医嘱</text><text x="24" y="102" fill="#607086" font-size="12">对象：王某某 OP202608140032</text><text x="24" y="132" fill="#607086" font-size="12">副作用：产生费用、待采集任务和患者通知</text><rect x="24" y="158" width="372" height="40" rx="6" fill="#FFF1F1" stroke="#E7A8A8"/><text x="42" y="183" fill="#8E2626" font-size="12">高风险：不同意则不执行任何写入</text><rect x="24" y="218" width="100" height="32" rx="6" fill="#1769E0"/><text x="47" y="239" fill="#fff" font-size="12">进入审查</text><rect x="136" y="218" width="80" height="32" rx="6" fill="#fff" stroke="#DCE3EB"/><text x="160" y="239" fill="#31445C" font-size="12">拒绝</text></g>
<g transform="translate(40 514)"><rect width="650" height="330" rx="10" fill="#fff" stroke="#E7A8A8"/><rect width="5" height="330" rx="3" fill="#C53030"/><text x="26" y="42" fill="#8E2626" font-size="16" font-weight="700">Agent 执行超时 · 回到人工</text><text x="26" y="78" fill="#31445C" font-size="13">第 3/5 步“查询幂等业务结果”超时</text><text x="26" y="110" fill="#607086" font-size="12">不自动重复提交；已完成的只读查询无需回滚</text><rect x="26" y="142" width="598" height="104" rx="7" fill="#F8FAFC" stroke="#DCE3EB"/><text x="46" y="174" fill="#126B4E" font-size="12">✓ 患者上下文校验</text><text x="46" y="202" fill="#126B4E" font-size="12">✓ 候选动作人工批准</text><text x="46" y="230" fill="#8E2626" font-size="12">× 最终业务结果未确认</text><rect x="26" y="270" width="126" height="34" rx="6" fill="#1769E0"/><text x="49" y="292" fill="#fff" font-size="12">查询业务结果</text><rect x="166" y="270" width="100" height="34" rx="6" fill="#fff" stroke="#DCE3EB"/><text x="189" y="292" fill="#31445C" font-size="12">转人工处理</text></g>
<g transform="translate(750 514)"><rect width="650" height="330" rx="10" fill="#fff" stroke="#A9D8C6"/><rect width="5" height="330" rx="3" fill="#168C64"/><text x="26" y="42" fill="#126B4E" font-size="16" font-weight="700">已完成 · 结果已人工核验</text><text x="26" y="78" fill="#31445C" font-size="13">2 项检验医嘱已创建，业务状态与审计一致</text><text x="26" y="110" fill="#607086" font-size="12">执行人：林医生 · Agent：ClinicalCopilot v2.1</text><rect x="26" y="142" width="598" height="104" rx="7" fill="#EAF8F1" stroke="#A9D8C6"/><text x="46" y="174" fill="#126B4E" font-size="12">幂等键：AI-ORD-20260814-3288</text><text x="46" y="202" fill="#126B4E" font-size="12">业务结果：ORD-188201 / ORD-188202</text><text x="46" y="230" fill="#126B4E" font-size="12">核验：人工确认无重复、无部分成功</text><rect x="26" y="270" width="108" height="34" rx="6" fill="#1769E0"/><text x="49" y="292" fill="#fff" font-size="12">返回医嘱页</text><rect x="148" y="270" width="100" height="34" rx="6" fill="#fff" stroke="#DCE3EB"/><text x="171" y="292" fill="#31445C" font-size="12">查看审计</text></g></g></svg>
