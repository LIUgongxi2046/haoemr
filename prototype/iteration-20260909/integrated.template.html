<style>

@media(max-width:720px){.integration-preview-grid{grid-template-columns:minmax(0,1fr)}.integration-preview-row{align-items:flex-start;flex-wrap:wrap}.integration-preview-actions .btn{min-height:44px}.integration-preview-tabs .btn{min-height:44px}.integration-preview-note{margin-top:8px}.integration-preview-row .btn{min-height:44px}}
</style></head><body>
<div class="shell" id="shell"><a class="skip-link" href="#main-content">跳到主要内容</a><header class="topbar"><a class="brand" href="#/admin" aria-label="HaoEMR 首页"><img class="brand-logo" src="__BRAND__" alt="HaoEMR Logo" width="38" height="38"><span class="brand-copy"><strong>HaoEMR</strong><small>电子病历系统</small></span></a><div class="context-pill">示例机构（合成）</div><div class="topbar-menu-control context-control role-control"><button class="context-pill domain-context" data-act="identity" aria-label="选择角色">系统管理员<small>⌄</small></button></div><form class="top-search" id="search-form"><input type="search" placeholder="搜索患者…" aria-label="搜索患者"><button type="submit">搜索</button></form><div class="top-actions"><button class="topbar-ai-assistant" data-existing="ai-assistant" aria-label="打开 AI医助 EVA"><img src="__EVA__" alt="" width="28" height="28"><small>AI医助 EVA</small></button><button class="icon-btn" data-existing="clinical-tasks" aria-label="统一待办">待</button><button class="icon-btn" data-act="scope" aria-label="打开操作指引">?</button><button class="avatar" data-act="identity" aria-label="用户登录与账户">管</button><div class="user-meta"><b>系统管理员（合成）</b><br><small>设计预览</small></div></div></header>
<aside class="sidebar" aria-label="一级导航"><div class="sidebar-header"><span class="sidebar-header-label">主菜单</span><button class="sidebar-collapse-toggle" data-act="collapse" aria-label="折叠一级导航" aria-expanded="true">‹</button></div><div id="primary-nav"></div></aside>
<main id="main-content" class="main has-admin-secondary-nav"><div class="admin-domain-layout"><aside class="admin-domain-nav card" aria-label="系统管理二级导航"><div class="admin-nav-title"><b>系统管理</b><span>身份 · 主数据 · 安全 · 运行</span></div><div id="admin-nav"></div><div class="admin-nav-divider"></div><a class="admin-domain-external" href="#/workflow">业务流程配置 →</a><a class="admin-domain-external" href="#/integration">接口集成管理 →</a></aside><section class="admin-domain-content"><section data-page-root class="content admin-content vue-native-page integration-preview-host" id="content"></section></section></div></main></div>
<dialog class="admin-action-dialog is-large is-default" id="dialog" aria-labelledby="dialog-title"><div class="admin-action-dialog-shell"><header><div><span>系统管理</span><h2 id="dialog-title"></h2><p id="dialog-description"></p></div><button data-act="close" aria-label="关闭弹窗">关闭</button></header><div class="admin-action-dialog-body" id="dialog-body"></div></div></dialog><div class="integration-preview-toast" id="toast" role="status"></div>
<script>
const nav=__NAV_JSON__,adminNav=__ADMIN_JSON__, $=s=>document.querySelector(s);
let route='admin',view='',units=[{code:'example',name:'示例机构（合成）',type:'机构'}],installState='NONE',operation=0,templatesPublished=false,otherReviewer=false,precheck='ready',timer=null,step=0,priorFocus=null,version='1.0.0',retained=0;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function button(label,act,primary=false,disabled=false){return `<button class="btn ${primary?'primary':''} integration-preview-focus" data-act="${act}" ${disabled?'disabled':''}>${label}</button>`}
function link(label,target,primary=false){return `<a class="btn ${primary?'primary':''}" href="#/${target}">${label}</a>`}

function panel(title,body){if(title==='初始化检查')return `<details class="card" open><summary class="card-head">${title}</summary><div class="card-body">${body}</div></details>`;return `<section class="card"><div class="card-head">${title}</div><div class="card-body">${body}</div></section>`}
function row(title,subtitle,right){return `<div class="integration-preview-row"><div><b>${title}</b><p>${subtitle}</p></div>${right}</div>`}
function notice(text,kind='info'){return `<div class="notice ${kind}">${text}</div>`}
function actions(html){return `<div class="integration-preview-actions">${html}</div>`}
function heading(title,sub,act=''){return `<div class="page-head"><div class="page-title"><h1 tabindex="-1">${title}</h1><p>${sub}</p></div><div class="head-actions">${act}</div></div>`}
function reviewNote(){return `<div class="integration-preview-note"><span>原界面增量设计 · 仅合成样例 · 主菜单与系统管理导航保持原样</span>${button('查看本页改动','scope')}</div>`}
function toast(t){$('#toast').textContent=t;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').textContent='',3500)}
function modal(title,body,desc=''){priorFocus=document.activeElement;$('#dialog-title').textContent=title;$('#dialog-description').textContent=desc;$('#dialog-body').innerHTML=body;if(!$('#dialog').open)$('#dialog').showModal()}
function close(){if($('#dialog').open)$('#dialog').close();if(priorFocus?.isConnected)priorFocus.focus()}
$('#dialog').addEventListener('close',()=>{if(priorFocus?.isConnected)priorFocus.focus()});
function go(path){close();location.hash='#/'+path}
function drawNav(){let group='';$('#primary-nav').innerHTML=nav.map(x=>{let h=x.group!==group?`<p class="nav-group">${esc(x.group)}</p>`:'';group=x.group;return h+`<a class="nav-item ${route.startsWith('admin')?'admin'===x.id?'active':'':route===x.id?'active':''}" href="#/${x.id}" aria-label="${x.label}" ${x.id==='admin'&&route.startsWith('admin')?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${x.icon}</span><span class="nav-label">${x.label}</span></a>`}).join('');
 const links=adminNav.map(x=>`<a class="admin-domain-link ${x.id===route&&(x.href.includes('?')?view==='branding':view!=='branding')?'active':''}" href="#${x.href}">${x.label}</a>`).join('');$('#admin-nav').outerHTML=links;}
function refreshAdminActive(){document.querySelectorAll('.admin-domain-link').forEach(a=>{const u=a.getAttribute('href').slice(1),parts=u.split('?');const active=parts[0]==='/'+route&&(u.includes('?')?view==='branding':view!=='branding');a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.querySelectorAll('#primary-nav a').forEach(a=>a.classList.toggle('active',route.startsWith('admin')?a.getAttribute('href')==='#/admin':a.getAttribute('href')==='#/'+route));}
function tabs(items){return `<div class="integration-preview-tabs" role="tablist">${items.map(x=>`<button class="btn" role="tab" aria-selected="${view===x[0]}" data-tab-view="${x[0]}">${x[1]}</button>`).join('')}</div>`}
function render(){const raw=location.hash.replace(/^#\//,'');const h=(!raw||/^#?SCR-/.test(raw))?'admin':raw;[route]=h.split('?');view=new URLSearchParams(h.split('?')[1]||'').get('view')||'';refreshAdminActive();let c='';
if(route==='admin'){
c=heading('系统管理工作台','查看机构、账户、权限和系统运行情况。',link('管理员审计','admin-audit')+link('创建管理变更单','config-release',true))+reviewNote();
c+=`<section class="metric-grid" aria-label="系统管理指标">${[['待审批管理变更',installState==='SUCCEEDED'&&!templatesPublished?'3':'0','合成样例'],['当前活跃账户','1','当前设计会话'],['权限治理风险','—','由原管理规则读取'],['校验失败任务定义','0','安装失败单独记录']].map(x=>`<article class="metric"><div class="name">${x[0]}</div><div class="value">${x[1]}</div><div class="trend">${x[2]}</div></article>`).join('')}</section>`;
c+=panel('初始化检查',row('机构、院区与科室',units.length>1?'已补充组织节点（模拟）':'保留原组织树；定位尚缺的院区、科室。',link('组织机构','admin-org'))+row('模块配置导入',installState==='SUCCEEDED'?'安装完成，新模板仍需原流程审批发布。':'配置文件预检与导入新增在参数页内。',link('模块初始化','admin-parameters?view=initialization',true))+row('签名、存储与接口就绪','检查项只汇总，不迁移原域功能，也不以连接代替业务验收。',button('查看依赖入口','readiness')));
c+=`<section class="admin-module-grid" aria-label="系统管理模块">${[['组织机构','admin-org','机构 · 院区 · 科室'],['用户账户','admin-users','人员、账号与任期'],['角色与工作组','admin-roles','授权与职责分离'],['权限策略','admin-permissions','版本化策略'],['字典术语','admin-dictionaries','沿用已有字典'],['医院主数据','admin-master-data','来源与业务映射'],['参数与开关','admin-parameters','原参数管理 + 模块初始化'],['后台任务','admin-jobs','原运行记录 + 配置安装记录']].map(x=>`<a class="admin-module" href="#/${x[1]}"><div><b>${x[0]}</b><span>${x[2]}</span></div><i aria-hidden="true">→</i></a>`).join('')}</section>`;
c+=`<div class="grid admin-overview">${panel('高优先级管理待办',row('新模板待审批',installState==='SUCCEEDED'&&!templatesPublished?'3 份导入草稿，定位到原模板列表。':'当前原型尚无待处理的模板导入。',link('模板输出','admin-templates')))}${panel('最近发布与回滚',`<p class="integration-preview-detail-text">保留现有审计摘要区域；本期安装与发布事件进入同一审计链。</p>${link('管理审计','admin-audit')}`)}</div>`;
}else if(route==='admin-org'){
c=heading('组织机构与工作单元','机构、院区、科室、病区和床位的统一版本化层级',button('导入组织','org-import')+button('查看变更影响','org-impact')+button('新建组织节点','org-create',true))+reviewNote();
c+=`<div class="grid admin-master-detail"><aside class="card org-tree"><div class="card-head">组织树</div><div class="card-body">${units.map((u,i)=>`<div class="folder-row" style="padding-left:${i?12:0}px">${esc(u.name)}<span>${u.type}</span></div>`).join('')}</div></aside><section class="card"><div class="toolbar"><input class="search" aria-label="搜索组织" placeholder="编码、名称或上级" id="org-search"><select class="select" aria-label="组织类型"><option>全部组织类型</option></select></div><div class="integration-preview-table"><table class="table"><thead><tr><th>编码</th><th>名称</th><th>类型</th><th>上级</th><th>状态</th></tr></thead><tbody id="org-rows">${units.map(u=>`<tr data-name="${esc(u.name+u.code)}"><td>${esc(u.code)}</td><td>${esc(u.name)}</td><td>${u.type}</td><td>${u.type==='机构'?'—':'示例机构'}</td><td>${status('有效','green')}</td></tr>`).join('')}</tbody></table></div><div class="card-body">${notice('复用已有组织维护与导入；首次引导只绑定管理员，不另建机构注册页。')}</div></section></div>`;
}else if(route==='admin-parameters'){
c=heading('系统参数与功能开关','带数据类型、适用范围、继承关系、依赖、风险和版本的受控配置，不允许随意覆盖',button('创建参数变更','parameter-existing',true))+reviewNote()+tabs([['','参数管理'],['initialization','模块初始化']]);
if(view==='initialization')c+=panel('模块初始化',notice('新增页内功能：导入受控配置文件。能力组合与灰度发布继续在原业务配置中管理。')+row('门诊基础病历模板','首包样例 · 1.0.0 · 3 份模板；正式来源与许可待指定。',button('查看并预检','package-detail',true))+row('演示业务数据','仅限隔离演示环境；正式环境服务端拒绝。',button('环境限制','demo'))+actions(link('配置安装记录','admin-jobs?view=installations')+link('能力包与灰度发布','capability-pack')));
else c+=panel(view==='branding'?'品牌与名称':'受控参数目录',notice(view==='branding'?'品牌视图复用原 BrandSettingsPanel；本轮不改变品牌或名称。':'原参数列表、继承、校验、审批发布保持原样。模块导入不写成任意参数 JSON。')+`<div class="integration-preview-table"><table class="table"><thead><tr><th>参数名称</th><th>类型</th><th>范围</th><th>状态</th></tr></thead><tbody><tr><td>病历自动保存间隔（示例）</td><td>整数</td><td>本机构</td><td>${status('示例','blue')}</td></tr><tr><td>会话安全策略（示例）</td><td>受控配置</td><td>本机构</td><td>${status('沿用原功能','blue')}</td></tr></tbody></table></div>`);
}else if(route==='admin-jobs'){
c=heading('通知调度与批量任务','后台任务逐项结果、重复提交保护、取消和业务对账；部分成功不伪装成全部完成',button('刷新','refresh'))+reviewNote()+tabs([['','运行记录'],['definitions','任务定义'],['installations','配置安装记录']]);
if(view==='installations')c+=panel('配置安装记录',installState==='NONE'?`<div class="integration-preview-empty">尚无配置安装记录。${actions(link('前往模块初始化','admin-parameters?view=initialization',true))}</div>`:`<div class="integration-preview-table"><table class="table"><thead><tr><th>操作编号</th><th>配置包</th><th>发起人</th><th>结果</th><th>查看</th></tr></thead><tbody><tr><td>PREVIEW-${operation}</td><td>门诊基础模板 ${version}</td><td>创建管理员（合成）</td><td>${status(installLabel(),installState==='SUCCEEDED'?'green':'amber')}</td><td>${button('查看安装详情','progress')}</td></tr></tbody></table></div>`);
else c+=panel(view==='definitions'?'任务定义':'运行记录',notice('沿用已有 AdministrationRuntime 与配置定义，不在本次原型重新实现任务引擎。')+row('原运行记录保留','安装任务在页内标签查询；不改变原任务重试、取消、部分成功规则。',button('查看原功能边界','jobs-existing')));
}else if(route==='admin-templates'){
c=heading('模板、编号与输出管理','统一管理目录、版本、适用范围、依赖、预览和患者身份安全字段',button('批量预览','templates-preview')+button('新建模板/规则','templates-existing',true))+reviewNote();
const exists=installState==='SUCCEEDED';
c+=`<div class="grid admin-list-detail"><section class="card"><div class="toolbar"><input class="search" placeholder="模板编码、名称或文书类型" aria-label="搜索模板" id="template-search"><select class="select" aria-label="模板状态"><option>全部模板状态</option><option>草稿</option><option>已发布</option></select></div><div class="integration-preview-table"><table class="table"><thead><tr><th>模板名称 / 编码</th><th>文书类型</th><th>适用范围</th><th>版本</th><th>状态</th></tr></thead><tbody id="template-rows">${exists?['初诊记录','复诊记录','门诊随访记录'].map((n,i)=>`<tr data-name="${n}"><td><b>${n}</b><br><span class="meta">OPD-${i+1} · 合成</span></td><td>门诊病历</td><td>当前机构</td><td>v1</td><td>${status(templatesPublished?'已发布':'草稿',templatesPublished?'green':'amber')}</td></tr>`).join(''):'<tr><td colspan="5">暂无导入模板；既有模板不因安装功能而重建。</td></tr>'}</tbody></table></div></section><aside class="card"><div class="card-head">${exists?'初诊记录 v1':'模板版本预览'}</div><div class="card-body"><div class="paper-mini"><b>示例机构（合成）</b><span>初诊记录</span><hr><div>主诉　现病史　处置记录</div></div><div class="folder-row">配置来源<span>${exists?'本次配置安装':'未安装'}</span></div><div class="folder-row">文书版本<span>${templatesPublished?'PUBLISHED':'DRAFT'}</span></div>${notice('沿用“审批发布”：创建人不能审批。安装不新增另一套提交、审核和发布状态机。','hard')}<div class="admin-actions vertical">${button('打开模板设计与修正','templates-existing')}${button(otherReviewer?'审批发布':'创建人不能审批','publish',true,!exists||templatesPublished||!otherReviewer)}</div><details class="integration-preview-dialog-tools"><summary>设计评审：模拟独立发布身份</summary>${button(otherReviewer?'恢复创建人身份':'使用另一名授权管理员','switch-reviewer')}</details></div></aside></div>`;
}else if(route==='admin-audit'){
c=heading('管理审计与权限复核','操作证据使用防篡改哈希链、重复提交保护和事务事件记录，可追溯且不可删除或改写',button('导出受控证据包','audit-export',true))+reviewNote()+panel('审计事件链',notice('复用既有按动作、对象筛选；新增安装动作映射。源码版本/CI 报告留在工程文档，不增加验收大屏。')+row('配置安装事件',installState==='NONE'?'尚无安装事件（原型）':`PREVIEW-${operation} · ${installLabel()}`,button('查看关联记录','audit-detail')));
}else{
const name=nav.find(x=>x.id===route)?.label||adminNav.find(x=>x.id===route)?.label||({'capability-pack':'能力包与灰度发布','integration':'接口集成管理','models':'模型服务','config-release':'配置发布'})[route]||'原有业务页面';
c=heading(name,'此功能继续使用原有页面。本次只展示入口归属，不重绘已有业务。')+reviewNote()+panel('原页面保持不变',notice(route==='capability-pack'?'能力包继承、能力组合、依赖解析、灰度与回退继续使用原 CapabilityPackPage，不搬进系统参数。':'本次新增管理功能不改变临床、AI、认证或其他业务的页面结构与责任边界。')+actions(`<a class="btn primary" href="http://127.0.0.1:4177/#/${encodeURIComponent(route)}" target="_blank" rel="noopener">打开原系统页面</a>`+link('返回管理工作台','admin')));
}
$('#content').innerHTML=c;$('#content').dataset.hostRoute=route;$('#content').dataset.view=view;$('#content h1')?.focus();
for(const [id,rows] of [['org-search','org-rows'],['template-search','template-rows']]){if($('#'+id))$('#'+id).addEventListener('input',e=>document.querySelectorAll('#'+rows+' tr[data-name]').forEach(tr=>tr.hidden=!tr.dataset.name.includes(e.target.value.trim())))}
}
function installLabel(){return ({NONE:'尚未安装',RUNNING:'执行中',SUCCEEDED:'安装完成，待审批发布',FAILED:'失败，已回滚',UNKNOWN:'结果待确认'})[installState]||installState}
function detail(){modal('导入配置包',row('门诊基础病历模板','版本 1.0.0；包含初诊、复诊、随访模板。',status('配置文件包'))+notice('配置包来源与许可在正式实施前指定；此处为固定预检样例。哈希完整性不能替代可信来源验证。')+actions(button('运行预检','precheck',true)), '系统管理 / 参数开关 / 模块初始化')}
function preflight(){modal('配置导入预检',row('目标机构','示例机构（合成）',status(precheck==='ready'?'预检通过（模拟）':'预检阻断',precheck==='ready'?'green':'amber'))+row('兼容性、来源、文件结构','正式实现逐项验证；不接受脚本、SQL 和秘密。',status('检查项样例'))+row('配置差异',`目标版本 ${version}；${retained?'保留 1 份医院修改，另 2 份建立新草稿。':'新增 3 份模板草稿。'}`,precheck==='conflict'?button('处理医院修改','conflict'):status('无未决冲突','green'))+(precheck==='missing'?notice('缺少病历基础能力，补齐依赖后重新预检。','hard'):precheck==='stale'?notice('当前配置版本发生变化，旧预检已失效。','hard'):'')+actions(button('返回包详情','package-detail')+button('重新预检','precheck')+button('确认导入','confirm',true,precheck!=='ready'))+`<details class="integration-preview-dialog-tools"><summary>设计评审：异常场景</summary>${actions(button('缺少依赖','missing')+button('医院修改冲突','make-conflict')+button('预检已失效','stale'))}</details>`,'仅增加现有管理弹窗；不创建预检菜单')}
function progress(){modal('配置安装详情',row(`PREVIEW-${operation}`,`门诊基础病历模板 ${version}`,status(installLabel(),installState==='SUCCEEDED'?'green':'amber'))+['校验机构与预检快照','写入目标领域配置草稿','保留安装结果与来源'].map((t,i)=>`<div class="integration-preview-step"><span>${t}</span>${status(installState==='SUCCEEDED'||i<step?'完成（模拟）':'待完成',installState==='SUCCEEDED'||i<step?'green':'gray')}</div>`).join('')+notice(installState==='FAILED'?'失败记录保留，配置写入已回滚；重试前重新预检。':installState==='UNKNOWN'?'不要重复提交，先查询原操作。':installState==='SUCCEEDED'?'安装完成只代表配置草稿已导入。到原模板输出页面审批发布。':'关闭详情不取消任务；回到通知任务可查询进度。')+actions(installState==='SUCCEEDED'?button('定位导入模板','to-templates',true):installState==='FAILED'?button('重新预检后重试','retry',true):installState==='UNKNOWN'?button('查询原操作','query',true):button('在任务页继续查看','to-jobs'))+`<details class="integration-preview-dialog-tools"><summary>设计评审：安装异常</summary>${actions(button('模拟失败回滚','fail')+button('模拟结果未知','unknown'))}</details>`,'系统管理 / 通知任务 / 配置安装记录')}
function start(){close();if(installState==='SUCCEEDED'){go('admin-jobs?view=installations');toast('此包版本已安装，未重复创建配置');return}operation++;installState='RUNNING';step=0;templatesPublished=false;location.hash='#/admin-jobs?view=installations';render();progress();clearInterval(timer);timer=setInterval(()=>{if(installState!=='RUNNING')return;step++;if(step===3){clearInterval(timer);installState='SUCCEEDED';toast('配置导入完成，仍需原流程审批发布（模拟）')}render();if($('#dialog').open&&$('#dialog-title').textContent==='配置安装详情')progress()},700)}
document.addEventListener('click',e=>{let v=e.target.closest('[data-tab-view]');if(v){go(route+(v.dataset.tabView?'?view='+v.dataset.tabView:''));return}let existing=e.target.closest('[data-existing]');if(existing){go(existing.dataset.existing);return}let a=e.target.closest('[data-act]');if(!a)return;switch(a.dataset.act){
case 'close':close();break;case 'collapse':$('#shell').classList.toggle('sidebar-collapsed');a.setAttribute('aria-expanded',String(!$('#shell').classList.contains('sidebar-collapsed')));a.textContent=$('#shell').classList.contains('sidebar-collapsed')?'›':'‹';break;
case 'scope':modal('本轮只做原系统内的增量',`<p class="integration-preview-detail-text">保留原 15 个主菜单与系统管理 13 个二级链接，复用原 CSS、品牌、管理弹窗和业务服务。</p><ul class="integration-preview-detail-text"><li>管理工作台：初始化检查区。</li><li>组织机构：已有组织树与新增节点表单。</li><li>参数开关：页内“模块初始化”。</li><li>通知任务：页内“配置安装记录”。</li><li>模板输出：原“审批发布”。</li><li>管理审计：原事件查询。</li></ul>${notice('原型只包含合成 UI 交互；未改变业务代码、账号或数据库。临床与 Eva 继续使用原页面。')}`);break;
case 'identity':modal('沿用现有账号与授权岗位',notice('此处不新建认证或角色系统。设计中仅在模板页面提供独立身份模拟，以验证创建人不能审批。'));break;
case 'readiness':modal('初始化检查 · 依赖入口',row('认证与授权','复用认证安全和权限策略。',link('认证安全','admin-auth'))+row('签名、存储与医院接口','生产适配器及回执需真实验收；保持原接入域。',link('接口集成管理','integration'))+row('能力组合与依赖','文件导入不替代能力定义和灰度发布。',link('能力包','capability-pack'))+row('运行与恢复记录','复用通知任务与审计记录。',link('通知任务','admin-jobs')));break;
case 'org-create':modal('新建组织节点',`<form class="integration-preview-form" id="org-form"><label>组织类型<select name="type"><option>院区</option><option>科室</option></select></label><label>编码<input name="code" required pattern="[A-Za-z0-9_-]{2,32}" placeholder="例：main-campus"></label><label>名称<input name="name" required placeholder="例：示例院区（合成）"></label><label>上级节点<select name="parent">${units.map(u=>`<option>${esc(u.name)}</option>`).join('')}</select></label><button class="btn primary" type="submit">保存组织节点（模拟）</button></form>`,'字段及层级沿用既有组织管理；非首次医院注册');$('#org-form').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);if(units.some(u=>u.code===f.get('code'))){toast('编码已存在，请修改');return}units.push({code:f.get('code').trim(),name:f.get('name').trim(),type:f.get('type')});close();render();toast('组织节点已保存（模拟）')});break;
case 'org-import':modal('复用现有组织导入',notice('现有组织页面已有按编码与父节点逐项导入功能。本期只补齐初始化缺项，不再实现第二个导入器。'));break;
case 'org-impact':modal('组织变更影响',notice(`当前设计样例 ${units.length} 个组织节点。真实影响继续由既有层级与有效期计算。`));break;
case 'package-detail':version='1.0.0';retained=0;detail();break;
case 'precheck':precheck='ready';preflight();break;case 'missing':precheck='missing';preflight();break;case 'stale':precheck='stale';preflight();break;case 'make-conflict':precheck='conflict';preflight();break;
case 'conflict':modal('医院修改差异',`<div class="integration-preview-grid"><div class="integration-preview-diff"><b>原包</b><p>主诉\n现病史\n处置记录</p></div><div class="integration-preview-diff"><b>医院当前版本</b><p>主诉\n现病史\n过敏信息核对\n处置记录</p></div><div class="integration-preview-diff"><b>新包候选</b><p>主诉\n现病史\n处置记录\n随访安排</p></div></div>${notice('默认保留医院已修改的内容。新内容只能创建草稿，不能覆盖已发布版本。')}${actions(button('保留医院版本并重新预检','keep',true)+button('取消处理','cancel-diff'))}`);break;
case 'keep':retained=1;precheck='ready';preflight();break;case 'cancel-diff':precheck='conflict';preflight();break;
case 'confirm':modal('确认导入配置草稿',notice(`目标：示例机构（合成）。包版本 ${version}；${retained?'保留 1 份医院配置，创建 2 份新草稿':'创建 3 份模板草稿'}。不会创建患者或自动发布。`)+actions(button('返回预检','precheck')+button('开始导入','start',true)));break;
case 'start':start();break;case 'progress':progress();break;case 'to-jobs':go('admin-jobs?view=installations');break;case 'to-templates':go('admin-templates');break;
case 'fail':clearInterval(timer);installState='FAILED';step=0;render();progress();break;case 'unknown':clearInterval(timer);installState='UNKNOWN';render();progress();break;case 'query':installState='FAILED';step=0;render();progress();toast('查询样例：原操作已失败并回滚');break;case 'retry':close();go('admin-parameters?view=initialization');precheck='ready';preflight();break;
case 'switch-reviewer':otherReviewer=!otherReviewer;render();toast(otherReviewer?'模拟另一名授权管理员；原权限机制不变':'已返回创建人身份');break;
case 'publish':modal('审批发布模板',notice('沿用原模板管理的审批发布动作；仅另一名具备现有权限的管理员可执行。发布后只影响新建文书。')+actions(button('取消','close')+button('确认审批发布（模拟）','publish-confirm',true)));break;
case 'publish-confirm':templatesPublished=true;close();render();toast('模板已审批发布（模拟）');break;
case 'templates-preview':modal('沿用已有模板预览',`<div class="paper-mini"><b>示例机构（合成）</b><span>初诊记录</span><hr><div>主诉　现病史　处置记录</div></div>`);break;
case 'audit-detail':if(installState==='NONE'){toast('尚无安装记录');break}go('admin-jobs?view=installations');progress();break;
case 'audit-export':{let blob=new Blob([JSON.stringify({design_only:true,operation:operation?`PREVIEW-${operation}`:null,state:installState},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='haoemr-integrated-design-audit.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已导出去敏原型摘要');break}
case 'refresh':render();toast('已刷新原型会话状态');break;
case 'demo':modal('正式环境拒绝演示数据',notice('正式配置包不携带患者与就诊，演示业务数据仅限独立隔离环境。'));break;
case 'parameter-existing':case 'jobs-existing':case 'templates-existing':modal('保留已有业务实现',notice('该操作继续使用现有页面组件、API 和领域用例。本期不重绘或替换它；原型只演示新增导入流程。'));break;
}});
document.addEventListener('click',e=>{if(e.target.closest('a[href^="#/"]'))close()});
$('#search-form').addEventListener('submit',e=>{e.preventDefault();modal('复用原患者搜索',notice('患者检索仍进入现有患者登记/查询入口，本设计不创建新的检索系统。'))});
window.addEventListener('hashchange',render);drawNav();render();
</script></body></html>
