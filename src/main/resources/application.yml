spring:
  application:
    name: haoemr-clinical-core
  datasource:
    url: ${HAOEMR_DB_URL:jdbc:postgresql://127.0.0.1:55432/haoemr_dev}
    username: ${HAOEMR_DB_USER:liuhaoxian}
    password: ${HAOEMR_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${HAOEMR_SERVER_PORT:8080}

haoemr:
  version: 0.1.0-SNAPSHOT
  archive:
    storage-root: ${HAOEMR_ARCHIVE_STORAGE_ROOT:${java.io.tmpdir}/haoemr-archive-objects}
    ocr-endpoint: ${HAOEMR_ARCHIVE_OCR_ENDPOINT:}
    cda-validation-endpoint: ${HAOEMR_ARCHIVE_CDA_VALIDATION_ENDPOINT:}
    malware-scanner:
      host: ${HAOEMR_ARCHIVE_MALWARE_SCANNER_HOST:}
      port: ${HAOEMR_ARCHIVE_MALWARE_SCANNER_PORT:3310}
      timeout-millis: ${HAOEMR_ARCHIVE_MALWARE_SCANNER_TIMEOUT_MILLIS:10000}
  security:
    emergency-reauthentication-max-age-seconds: 300
  outbox:
    enabled: false
    batch-size: 50
    lease-seconds: 30
    max-attempts: 5
    poll-delay-ms: 1000
  task-center:
    notification-scheduler-enabled: ${HAOEMR_TASK_NOTIFICATION_SCHEDULER_ENABLED:true}
    notification-poll-delay-ms: ${HAOEMR_TASK_NOTIFICATION_POLL_DELAY_MS:5000}
    lifecycle-scheduler-enabled: ${HAOEMR_TASK_LIFECYCLE_SCHEDULER_ENABLED:true}
    lifecycle-poll-delay-ms: ${HAOEMR_TASK_LIFECYCLE_POLL_DELAY_MS:15000}
    lifecycle-initial-delay-ms: ${HAOEMR_TASK_LIFECYCLE_INITIAL_DELAY_MS:60000}
  medical-agent:
    external-models-enabled: ${HAOEMR_MEDICAL_AGENT_EXTERNAL_MODELS_ENABLED:true}
    worker:
      enabled: true
      lease-seconds: 180
      poll-delay-ms: 500
  model-secrets:
    directory: ${HAOEMR_MODEL_SECRET_DIRECTORY:${java.io.tmpdir}/haoemr-model-secrets}
